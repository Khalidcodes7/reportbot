[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportbot"
version = "0.1.0"
description = "Scrape data, build a formatted Excel report, and email it automatically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Khalid", email = "k.naveedfsd1968@gmail.com" }]
keywords = ["automation", "report-generation", "web-scraping", "email-automation", "excel", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.31",
    "parsel>=1.8",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "sendgrid>=6.11",
    "scrapekit @ git+https://github.com/Khalidcodes7/scrapekit.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
reportbot = "reportbot.cli:main"

[project.urls]
Homepage = "https://github.com/Khalidcodes7/reportbot"
Issues = "https://github.com/Khalidcodes7/reportbot/issues"

[tool.setuptools.packages.find]
include = ["reportbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]